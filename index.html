<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trainer App — Portfolio Project 2</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>Trainer App</h1>
  <p>Workout plans rendered from JSON. Log a session, export it as CSV.</p>
</header>
<main>
  <section class="filters">
    <label>Focus
      <select id="focusFilter">
        <option value="all">All</option>
      </select>
    </label>
    <label>Level
      <select id="levelFilter">
        <option value="all">All</option>
      </select>
    </label>
  </section>
  <section id="timerPanel" class="timer hidden">
    <h2 id="timerProgram">Workout</h2>
    <div id="timerPhase" class="timer-phase work">READY</div>
    <div id="timerLabel" class="timer-label">—</div>
    <div id="timerClock" class="timer-clock">00:00</div>
    <div id="timerProgress" class="timer-progress"></div>
    <div class="timer-controls">
      <button id="timerStartPause" type="button">Start</button>
      <button id="timerSkip" type="button">Skip</button>
      <button id="timerStop" type="button">Stop</button>
    </div>
  </section>
  <section id="programs" class="grid"></section>
  <section class="log">
    <h2>Session log</h2>
    <form id="logForm">
      <input name="program" placeholder="Program title" required>
      <input name="duration" type="number" min="1" placeholder="Minutes" required>
      <input name="notes" placeholder="Notes (optional)">
      <button type="submit">Save session</button>
    </form>
    <ul id="logList"></ul>
    <button id="exportCsv" type="button">Export log as CSV</button>
  </section>
</main>
<script src="js/app.js"></script>
</body>
</html>
